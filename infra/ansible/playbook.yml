# =============================================================================
# Sprea Ansible Playbook - Configure the droplet
# =============================================================================
# Run after Terraform creates the droplet. This playbook:
#   1. Installs Docker
#   2. Optionally installs k3s (lightweight Kubernetes) - uncomment if needed
#
# Usage:
#   cd infra/ansible
#   ansible-playbook -i inventory playbook.yml
#
# Inventory: create inventory from droplet IP:
#   echo "YOUR_DROPLET_IP ansible_user=root" > inventory
# =============================================================================

- name: Configure Docker droplet
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true

    - name: Ensure Docker service is started
      service:
        name: docker
        state: started
        enabled: true

    - name: Verify Docker is running
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Print Docker version
      debug:
        msg: "{{ docker_version.stdout }}"
