---
- name: Install k3s
  hosts: all
  become: true

  tasks:
    - name: Install k3s (Traefik disabled for Caddy)
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure k3s is started
      service:
        name: k3s
        state: started
        enabled: true
